
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- MAIN CONTENT -->
        <main class="main">

            <header>
                <div>
                    <p class="welcome">YOUR PERSONAL WORKSPACE</p>
                    <h1>My Tasks</h1>
                    <p class="description">
                        Manage your day and get things done.
                    </p>
                </div>
            </header>

            <!-- STATISTICS -->
            <section class="stats">

                <div class="stat-card">
                    <p>Total Tasks</p>
                    <h2 id="totalTasks">0</h2>
                </div>

                <div class="stat-card">
                    <p>Completed</p>
                    <h2 id="completedTasks">0</h2>
                </div>

                <div class="stat-card">
                    <p>Remaining</p>
                    <h2 id="pendingTasks">0</h2>
                </div>

            </section>

            <!-- ADD TASK -->
            <section class="task-section">

                <div class="section-heading">
                    <h2>My To-Do List</h2>
                    <p>Keep track of your daily goals.</p>
                </div>

                <div class="input-area">
                    <input
                        type="text"
                        id="todoInput"
                        placeholder="What needs to be done?"
                    >

                    <button id="addBtn">+ Add Task</button>
                </div>

                <div class="task-heading">
                    <h3>All Tasks</h3>
                    <span id="taskCount">0 tasks</span>
                </div>

                <ul id="todoList"></ul>

                <p id="emptyMessage">
                    No tasks yet. Add your first task!
                </p>

            </section>

            <footer>
                Made for a more productive day.
            </footer>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
